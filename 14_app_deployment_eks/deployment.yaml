apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-web-deployment
  namespace: kuldeep-p14
  labels:
    app: capstone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-web
  template:
    metadata:
      labels:
        app: capstone-web
    spec:
      containers:
        - name: web-app
          image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/capstone-web-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-web-service
  namespace: kuldeep-p14
spec:
  type: LoadBalancer
  selector:
    app: capstone-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
