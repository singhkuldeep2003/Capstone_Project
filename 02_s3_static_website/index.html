<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S3 Static Website via Terraform</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .badge { display: inline-block; background: #0284c7; color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Static Website Live on Amazon S3</h1>
        <p>Deployed with Infrastructure as Code using Terraform.</p>
        <span class="badge">AWS S3 Static Hosting</span>
    </div>
</body>
</html>
