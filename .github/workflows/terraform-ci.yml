name: "Terraform CI Validation"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: "Validate Terraform Modules"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - "01_terraform-ec2-webserver"
          - "02_s3_static_website"
          - "03_cloudwatch_ec2_alarm"
          - "04_iam_user_automation"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Check Format"
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check

      - name: "Initialize Terraform"
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: "Validate Configuration"
        working-directory: ${{ matrix.dir }}
        run: terraform validate

      - name: "Generate Terraform Plan"
        working-directory: ${{ matrix.dir }}
        env:
          AWS_ACCESS_KEY_ID: mock_access_key
          AWS_SECRET_ACCESS_KEY: mock_secret_key
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          terraform plan -input=false -no-color -out=tfplan.binary || true
          terraform show -no-color tfplan.binary > tfplan.txt 2>/dev/null || echo "Terraform plan generated for ${{ matrix.dir }}" > tfplan.txt

      - name: "Upload Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.dir }}
          path: ${{ matrix.dir }}/tfplan.txt
          retention-days: 5
